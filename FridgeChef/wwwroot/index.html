<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FridgeChef</title>
    <base href="/" />

    <link rel="stylesheet" href="css/app.css" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />

</head>

<body>

    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.fridgeChefLanguage = {
            get: function () {
                return localStorage.getItem("fridgechef-language") || "uk-UA";
            },

            set: function (language) {
                localStorage.setItem("fridgechef-language", language);
                location.reload();
            }
        };

        const savedLanguage = window.fridgeChefLanguage.get();

        document.documentElement.lang =
            savedLanguage === "en-US" ? "en" : "uk";
    </script>


    <script src="_framework/blazor.webassembly.js"
            autostart="false"></script>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>

    <script>
        Blazor.start({
            applicationCulture: savedLanguage
        });
    </script>

</body>



</html>
