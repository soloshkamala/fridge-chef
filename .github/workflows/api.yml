name: Deploy FridgeChef API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fridgechef-api-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build client tests
        run: dotnet build FridgeChef.Tests/FridgeChef.Tests.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh FridgeChef.Tests/bin/Release/net8.0/playwright.ps1 install --with-deps chromium

      - name: Run client tests
        run: dotnet test FridgeChef.Tests/FridgeChef.Tests.csproj -c Release --no-build

      - name: Run server tests
        run: dotnet test Server.Tests/Server.Tests.csproj -c Release

      - name: Install Entity Framework CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.11

      - name: Restore API
        run: dotnet restore FridgeChef.Api/FridgeChef.Api.csproj

      - name: Create migration bundle
        run: |
          dotnet ef migrations bundle \
            --project FridgeChef.Api/FridgeChef.Api.csproj \
            --startup-project FridgeChef.Api/FridgeChef.Api.csproj \
            --context FridgeChefDbContext \
            --self-contained \
            -r linux-x64 \
            --output ./efbundle

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow GitHub runner access to PostgreSQL
        id: firewall
        run: |
          RUNNER_IP=$(curl -4 -fsS https://api.ipify.org)

          az postgres flexible-server firewall-rule create \
            --resource-group rg-fridgechef \
            --server-name fridgechef-postgres \
            --name "GitHubActions-${{ github.run_id }}-${{ github.run_attempt }}" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

          sleep 60

      - name: Apply database migrations
        env:
          DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING }}
        run: |
          cp FridgeChef.Api/appsettings.json ./appsettings.json
          chmod +x ./efbundle
          ./efbundle --connection "$DB_CONNECTION_STRING"

      - name: Remove GitHub runner firewall rule
        if: always() && steps.firewall.outcome != 'skipped'
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group rg-fridgechef \
            --server-name fridgechef-postgres \
            --name "GitHubActions-${{ github.run_id }}-${{ github.run_attempt }}" \
            --yes

      - name: Publish API
        run: |
          dotnet publish FridgeChef.Api/FridgeChef.Api.csproj \
            -c Release \
            -r linux-x64 \
            --self-contained true \
            -p:UseAppHost=true \
            -o ./publish

      - name: Set executable permission
        run: chmod +x ./publish/FridgeChef.Api

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: fridgechef-api
          package: ./publish
